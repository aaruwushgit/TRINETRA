# Single entrypoint for the whole platform: `docker compose up --build`
# from the repo root brings up Postgres/PostGIS, Redis, Kafka, the Kafka
# consumer, and the backend — which itself serves the frontend (dashboard,
# live view, sandbox, benchmarks) as static pages, so there is no separate
# frontend container. Open http://localhost:8000/app once it's up.
services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: vehicle_postgres
    # Tuned for bulk loading a year of history. The image defaults
    # (shared_buffers 128MB, max_wal_size 1GB, work_mem 4MB) are sized for a
    # small container and killed the backend mid-COPY: a 40M-row load emitted
    # ~900MB of WAL inside one checkpoint interval, right at max_wal_size,
    # with nothing able to recycle it.
    #
    # The VM has 7.75GB and steady-state use is ~2GB, so this is affordable.
    command:
      - postgres
      # Cache. 1GB is ~13% of the VM, the usual starting point.
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      # Sorts and hashes. The road_usage rollup runs
      # LAG() OVER (PARTITION BY plate) across the whole table; at 4MB this
      # spills to disk on every partition.
      - -c
      - work_mem=64MB
      # CREATE INDEX on 40M rows.
      - -c
      - maintenance_work_mem=512MB
      # Let WAL grow between checkpoints instead of forcing one every ~900MB
      # mid-load. This is the setting that actually caused the crash.
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=512MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      # Bulk COPY is single-threaded; give the rollups some parallelism.
      - -c
      - max_parallel_workers_per_gather=2
    environment:
      POSTGRES_DB: vehicle_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vehicle_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vehicle_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vehicle_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Backend + frontend in one container: FastAPI serves the dashboard,
  # sandbox, live view and benchmarks pages as static files (see
  # services/backend/backend/main.py), and bundles the ALPR service
  # (services/alpr) as a real dependency, not a stub.
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: vehicle_backend
    ports:
      - "8000:8000"
    volumes:
      # The populated database (12.8M Delhi events) lives on the host. The
      # *directory* is mounted, not the file, because SQLite writes -wal and
      # -shm alongside the database and cannot create them into a file mount.
      - ./services/backend:/data
      # The bundled demo clips are referenced by absolute host path, hardcoded
      # in both frontend/test.html (ARCHIVE_DIR) and backend/api/jobs.py
      # (ALLOWED_SOURCE_ROOTS), so the archive is mounted at that same path
      # inside the container and both keep resolving unchanged.
      - ./archive:/Users/aarushsharma/Documents/SIH/archive:ro
      # PaddleX/PaddleOCR's downloaded model weights. Without this volume the
      # container has nowhere to keep them: the writable layer is wiped on
      # every `docker compose up --build`/recreate, so PP-OCR gets
      # re-downloaded (and the OCR client re-pings the model hoster for a
      # connectivity check first) on every restart — this is what made the
      # sandbox feel newly slow after a rebuild. One shared named volume
      # across backend/live_feeder/kafka_consumer means only the *first*
      # container to touch OCR pays the download.
      - paddlex_models:/root/.paddlex
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/vehicle_intelligence
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      KAFKA_BROKER: kafka:29092
      USE_KAFKA: "true"
      ANPR_WEIGHTS_PATH: /app/alpr/best.pt
      ANPR_REPO_PATH: /app/alpr
      ANPR_DEVICE: cpu
      # Skip PaddleX's per-process "checking connectivity to the model
      # hosters" probe. It re-runs even when the weights are already cached
      # locally, and it is a real network round trip on every cold start.
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  # Next.js frontend: Surveillance + Sandbox. Replaces the four static HTML
  # pages FastAPI used to serve (those still work at /app during the
  # transition). Talks to the backend straight from the browser, so it needs
  # no server-side proxy — the backend already allows all origins.
  #
  # NEXT_PUBLIC_* are BUILD args, not runtime env: Next inlines them into the
  # client bundle at build time. Changing the TomTom key therefore needs a
  # rebuild of this service, not just a restart.
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        # Reached from the user's browser, so localhost — not the compose
        # service name, which only resolves inside the network.
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        # Read from services/frontend/.env.local (gitignored) if present, else
        # empty — in which case the traffic toggle reports "no key configured"
        # and the map falls back to congestion counts from our own events.
        NEXT_PUBLIC_TOMTOM_API_KEY: ${NEXT_PUBLIC_TOMTOM_API_KEY:-}
    container_name: vehicle_frontend
    ports:
      # 3001 on the host: 3000 is taken by an unrelated local project. The
      # container still listens on 3000 internally.
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Keeps "now" populated. Without it the dashboard shows a month of history
  # that stops several days ago, so every last-hour panel reads zero.
  live_feeder:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: vehicle_live_feeder
    command: python scripts/live_event_feeder.py --events-per-sec 20 --diurnal-rate
    volumes:
      - ./services/backend:/data
      - paddlex_models:/root/.paddlex
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/vehicle_intelligence
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      USE_KAFKA: "false"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka_consumer:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: vehicle_kafka_consumer
    command: python scripts/run_kafka_consumer.py
    volumes:
      - ./services/backend:/data
      - paddlex_models:/root/.paddlex
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/vehicle_intelligence
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      KAFKA_BROKER: kafka:29092
      USE_KAFKA: "true"
      ANPR_WEIGHTS_PATH: /app/alpr/best.pt
      ANPR_REPO_PATH: /app/alpr
      ANPR_DEVICE: cpu
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    depends_on:
      - backend

volumes:
  pgdata:
  paddlex_models:
